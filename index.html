<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足球数据中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a120a}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#4caf50,#2e7d32);border-radius:3px}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0a120a;color:#eee;padding:10px;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 20% 50%,rgba(46,125,50,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(76,175,80,0.05) 0%,transparent 40%),radial-gradient(ellipse at 50% 80%,rgba(27,94,32,0.06) 0%,transparent 50%);z-index:0;pointer-events:none}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");pointer-events:none;z-index:0}

.football-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden;opacity:0.35}
.football-bg .main-ball{position:absolute;width:750px;height:750px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#888,#222);top:50%;left:50%;margin-left:-375px;margin-top:-375px;animation:drift 25s ease-in-out infinite,spin 40s linear infinite,breath 6s ease-in-out infinite;box-shadow:inset -40px -40px 100px rgba(0,0,0,0.9),inset 40px 40px 100px rgba(255,255,255,0.12),0 0 150px rgba(0,0,0,0.5)}
.football-bg .main-ball::before{content:'';position:absolute;top:-2%;left:-2%;width:104%;height:104%;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,0.08),transparent 60%)}
.football-bg .pattern{position:absolute;width:100%;height:100%;top:0;left:0}
.football-bg .pentagon{position:absolute;background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.15);clip-path:polygon(50% 0%,100% 38%,81% 100%,19% 100%,0% 38%);animation:float 10s ease-in-out infinite alternate}
.football-bg .pentagon:nth-child(1){top:8%;left:18%;width:55px;height:55px;animation-delay:0s}
.football-bg .pentagon:nth-child(2){top:12%;right:22%;width:50px;height:50px;animation-delay:1.2s}
.football-bg .pentagon:nth-child(3){bottom:18%;left:12%;width:60px;height:60px;animation-delay:2.4s}
.football-bg .pentagon:nth-child(4){bottom:22%;right:18%;width:48px;height:48px;animation-delay:3.6s}
.football-bg .pentagon:nth-child(5){top:42%;left:3%;width:45px;height:45px;animation-delay:4.8s}
.football-bg .pentagon:nth-child(6){top:38%;right:5%;width:52px;height:52px;animation-delay:6s}
.football-bg .pentagon:nth-child(7){bottom:38%;left:5%;width:42px;height:42px;animation-delay:7.2s}
.football-bg .pentagon:nth-child(8){bottom:42%;right:8%;width:55px;height:55px;animation-delay:8.4s}
.football-bg .pentagon:nth-child(9){top:58%;left:22%;width:40px;height:40px;animation-delay:1.8s}
.football-bg .pentagon:nth-child(10){top:52%;right:25%;width:44px;height:44px;animation-delay:4.2s}
.football-bg .pentagon:nth-child(11){bottom:8%;left:38%;width:38px;height:38px;animation-delay:6.6s}
.football-bg .pentagon:nth-child(12){top:15%;left:48%;width:48px;height:48px;animation-delay:3s}
.football-bg .pentagon:nth-child(13){bottom:15%;right:42%;width:42px;height:42px;animation-delay:5.4s}
.football-bg .pentagon:nth-child(14){top:30%;left:12%;width:35px;height:35px;animation-delay:7.8s}
.football-bg .pentagon:nth-child(15){bottom:30%;right:15%;width:38px;height:38px;animation-delay:2.2s}
.football-bg .line{position:absolute;background:rgba(255,255,255,0.03);border-radius:50%;border:1px solid rgba(255,255,255,0.04)}
.football-bg .line:nth-child(16){width:280px;height:280px;top:50%;left:50%;transform:translate(-50%,-50%)}
.football-bg .line:nth-child(17){width:420px;height:420px;top:50%;left:50%;transform:translate(-50%,-50%)}
.football-bg .line:nth-child(18){width:560px;height:560px;top:50%;left:50%;transform:translate(-50%,-50%)}

@keyframes drift{
0%{transform:translate(0,0) rotate(0deg)}
12.5%{transform:translate(60px,-40px) rotate(45deg)}
25%{transform:translate(100px,0) rotate(90deg)}
37.5%{transform:translate(60px,40px) rotate(135deg)}
50%{transform:translate(0,60px) rotate(180deg)}
62.5%{transform:translate(-60px,40px) rotate(225deg)}
75%{transform:translate(-100px,0) rotate(270deg)}
87.5%{transform:translate(-60px,-40px) rotate(315deg)}
100%{transform:translate(0,0) rotate(360deg)}
}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes float{0%{transform:translateY(0px) rotate(0deg);opacity:0.3}100%{transform:translateY(-25px) rotate(20deg);opacity:0.8}}

h1{text-align:center;margin:20px 0 10px;font-size:2em;font-weight:800;background:linear-gradient(135deg,#66bb6a,#a5d6a7,#66bb6a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;animation:gradientShift 4s ease-in-out infinite;position:relative;z-index:2;letter-spacing:-0.5px;text-shadow:0 0 60px rgba(76,175,80,0.15)}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
h1 .badge{font-size:12px;background:rgba(76,175,80,0.15);color:#a5d6a7;padding:3px 16px;border-radius:20px;margin-left:12px;-webkit-text-fill-color:#a5d6a7;font-weight:500;border:1px solid rgba(76,175,80,0.1);vertical-align:middle;backdrop-filter:blur(4px)}
h1 .live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#4caf50;margin-right:8px;-webkit-text-fill-color:initial;animation:pulse-dot 1.5s ease-in-out infinite;vertical-align:middle}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(76,175,80,0.4)}50%{opacity:0.6;transform:scale(0.85);box-shadow:0 0 20px 8px rgba(76,175,80,0)}}

.main-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0 14px;position:relative;z-index:2}
.main-nav a{padding:10px 28px;border-radius:30px;border:1px solid rgba(76,175,80,0.15);background:rgba(255,255,255,0.02);color:#8bc34a;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.35s cubic-bezier(0.4,0,0.2,1);backdrop-filter:blur(12px);position:relative;overflow:hidden}
.main-nav a::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(76,175,80,0.1),transparent);transition:left 0.6s ease}
.main-nav a:hover::before{left:100%}
.main-nav a:hover{background:rgba(76,175,80,0.08);border-color:rgba(76,175,80,0.3);transform:translateY(-2px);box-shadow:0 8px 30px rgba(76,175,80,0.08)}
.main-nav a.on{background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;border-color:#4caf50;box-shadow:0 4px 25px rgba(76,175,80,0.25),inset 0 1px 0 rgba(255,255,255,0.1)}
.main-nav a.on::before{display:none}

.league-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:10px 0;position:relative;z-index:2}
.league-nav button{padding:7px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);color:#666;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.25s ease;backdrop-filter:blur(4px)}
.league-nav button:hover{background:rgba(76,175,80,0.06);color:#b8d9b0;border-color:rgba(76,175,80,0.15);transform:translateY(-1px)}
.league-nav button.on{background:rgba(76,175,80,0.12);color:#4caf50;border-color:#4caf50;box-shadow:0 0 30px rgba(76,175,80,0.04)}
.league-nav button .icon{margin-right:4px}

.tz-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px;align-items:center;padding:8px 18px;background:rgba(255,255,255,0.015);border-radius:14px;border:1px solid rgba(255,255,255,0.03);backdrop-filter:blur(12px);position:relative;z-index:2}
.tz-label{color:#444;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px}
.tz-group{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,0.02);border-radius:14px;padding:2px;border:1px solid rgba(255,255,255,0.03)}
.tz-group button{background:transparent;border:none;color:#4caf50;padding:3px 12px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s ease}
.tz-group button:hover{background:rgba(76,175,80,0.1)}
.tz-display{color:#ffd740;font-size:12px;min-width:40px;font-weight:700}
.tz-divider{color:#222;font-size:12px;padding:0 2px}

.bar{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;align-items:center;position:relative;z-index:2}
.bar input{flex:1;padding:10px 20px;border-radius:30px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);color:#eee;font-size:13px;min-width:140px;transition:all 0.3s ease;backdrop-filter:blur(8px)}
.bar input:focus{outline:none;border-color:rgba(76,175,80,0.2);background:rgba(255,255,255,0.04);box-shadow:0 0 40px rgba(76,175,80,0.02)}
.bar input::placeholder{color:#333}
.bar button{padding:10px 22px;border-radius:30px;border:none;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.3s ease;box-shadow:0 4px 20px rgba(76,175,80,0.15);position:relative;overflow:hidden}
.bar button::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1),transparent 60%);opacity:0;transition:opacity 0.3s}
.bar button:hover::after{opacity:1}
.bar button:hover{transform:translateY(-2px);box-shadow:0 8px 35px rgba(76,175,80,0.25)}
.bar .count{color:#444;font-size:12px;font-weight:500;margin-left:4px}

#autoRefreshBtn{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);color:#666;min-width:110px;display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:30px;font-weight:600;font-size:13px;cursor:pointer;transition:all 0.3s ease;box-shadow:none}
#autoRefreshBtn:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.08)}
#autoRefreshBtn.active{background:rgba(76,175,80,0.08);border-color:rgba(76,175,80,0.2);color:#4caf50}
#autoRefreshBtn.disabled{opacity:0.4;cursor:not-allowed;pointer-events:none}
#autoRefreshBtn .pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.7)}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;position:relative;z-index:2}
.card{background:rgba(255,255,255,0.015);border-radius:20px;padding:18px;border:1px solid rgba(255,255,255,0.03);transition:all 0.5s cubic-bezier(0.23,1,0.32,1);backdrop-filter:blur(12px);animation:fadeUp 0.6s cubic-bezier(0.23,1,0.32,1) forwards;opacity:0;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(76,175,80,0.1),transparent);opacity:0;transition:opacity 0.6s}
.card:hover::before{opacity:1}
.card:nth-child(1){animation-delay:0.03s}
.card:nth-child(2){animation-delay:0.06s}
.card:nth-child(3){animation-delay:0.09s}
.card:nth-child(4){animation-delay:0.12s}
.card:nth-child(5){animation-delay:0.15s}
.card:nth-child(6){animation-delay:0.18s}
.card:nth-child(7){animation-delay:0.21s}
.card:nth-child(8){animation-delay:0.24s}
.card:nth-child(9){animation-delay:0.27s}
.card:nth-child(10){animation-delay:0.30s}
.card:nth-child(11){animation-delay:0.33s}
.card:nth-child(12){animation-delay:0.36s}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.card:hover{background:rgba(255,255,255,0.025);border-color:rgba(76,175,80,0.08);transform:translateY(-4px);box-shadow:0 20px 60px rgba(0,0,0,0.3)}

.card .top{color:#444;font-size:10px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;letter-spacing:0.5px;text-transform:uppercase}
.card .top .status-tag{padding:2px 10px;border-radius:10px;font-size:9px;font-weight:700}
.card .top .status-tag.live{background:rgba(255,82,82,0.15);color:#ff5252;animation:blink 1.2s infinite}
.card .top .status-tag.finished{background:rgba(255,255,255,0.04);color:#444}
.card .top .status-tag.upcoming{background:rgba(76,175,80,0.08);color:#4caf50}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

.card .row{display:flex;align-items:center;gap:10px}
.card .side{flex:1;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.card .side img{width:24px;height:24px;border-radius:50%;object-fit:contain;flex-shrink:0;background:rgba(255,255,255,0.02);padding:2px}
.card .side.r{justify-content:flex-end;text-align:right}
.card .side .win{color:#4caf50;font-weight:700}
.card .side .lose{color:#555;font-weight:400}
.card .side .draw{color:#ffd740;font-weight:700}
.card .side .team-link{cursor:pointer;text-decoration:none;border-bottom:2px solid transparent;transition:all 0.25s ease;position:relative}
.card .side .team-link:hover{border-bottom-color:#4caf50;color:#a5d6a7}
.card .side .team-link .info-icon{font-size:10px;opacity:0.4;transition:opacity 0.2s}
.card .side .team-link:hover .info-icon{opacity:1}
.card .mid{font-size:1.6em;font-weight:800;color:#4caf50;min-width:50px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.card .mid.score-live{color:#ffd740}
.card .mid.score-finished{color:#4caf50}
.card .bot{font-size:11px;color:#444;text-align:center;margin-top:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.card .bot button{background:rgba(76,175,80,0.04);border:1px solid rgba(76,175,80,0.06);color:#4caf50;border-radius:14px;padding:3px 14px;font-size:10px;font-weight:600;cursor:pointer;transition:all 0.25s ease}
.card .bot button:hover{background:rgba(76,175,80,0.1);border-color:rgba(76,175,80,0.15);transform:scale(1.02)}

.card .source-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card .source{color:#4caf50;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.card .source-tag{background:rgba(255,255,255,0.04);color:#555;padding:0 10px;border-radius:12px;font-size:9px}
.card .title{font-size:14px;font-weight:600;margin:6px 0;color:#eee;line-height:1.4}
.card .title a{color:#eee;text-decoration:none;transition:color 0.2s}
.card .title a:hover{color:#ffd740}
.card .summary{color:#888;font-size:12px;line-height:1.6;margin:4px 0;flex:1}
.card .meta{color:#555;font-size:10px;margin-top:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px solid rgba(255,255,255,0.04);padding-top:8px}
.card .meta .read-link{color:#ffd740;text-decoration:none;font-weight:600;font-size:11px;transition:all 0.2s ease}
.card .meta .read-link:hover{color:#fff3b0;text-decoration:underline}
.card .meta .tag{background:rgba(76,175,80,0.1);color:#4caf50;padding:0 10px;border-radius:12px;font-size:9px;font-weight:600}
.card .meta .news-tag{background:rgba(255,215,64,0.08);color:#ffd740;padding:0 10px;border-radius:12px;font-size:9px;font-weight:600}

.standings-wrap{background:rgba(255,255,255,0.01);border-radius:16px;border:1px solid rgba(255,255,255,0.03);overflow:hidden;margin:4px 0 8px}
.standings-wrap .table-scroll{overflow-x:auto}
.standings-wrap table{width:100%;border-collapse:collapse;font-size:13px}
.standings-wrap th{background:rgba(76,175,80,0.05);padding:12px 14px;text-align:left;color:#4caf50;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(76,175,80,0.05)}
.standings-wrap td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.015);transition:background 0.2s}
.standings-wrap tr:last-child td{border-bottom:none}
.standings-wrap tr:hover td{background:rgba(255,255,255,0.02)}
.standings-wrap .rank{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:12px;margin-right:8px;flex-shrink:0}
.standings-wrap .rank.gold{background:linear-gradient(135deg,#ffd700,#f9a825);color:#1a1a1a;box-shadow:0 2px 12px rgba(255,215,0,0.3)}
.standings-wrap .rank.silver{background:linear-gradient(135deg,#e0e0e0,#bdbdbd);color:#1a1a1a;box-shadow:0 2px 12px rgba(189,189,189,0.2)}
.standings-wrap .rank.bronze{background:linear-gradient(135deg,#e8a87c,#d4845a);color:#fff;box-shadow:0 2px 12px rgba(212,132,90,0.25)}
.standings-wrap .rank.normal{color:#444;font-weight:600;background:rgba(255,255,255,0.02)}
.standings-wrap .team-cell{display:flex;align-items:center;gap:8px;font-weight:600;color:#eee}
.standings-wrap .team-cell .team-logo-img{width:22px;height:22px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,0.02);padding:2px;flex-shrink:0}
.standings-wrap .team-cell .team-logo-fallback{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;text-transform:uppercase}
.standings-wrap .stat{font-weight:500;color:#aaa}
.standings-wrap .gd-positive{color:#4caf50;font-weight:700}
.standings-wrap .gd-negative{color:#ff5252;font-weight:700}
.standings-wrap .gd-zero{color:#444;font-weight:600}
.standings-wrap .points{font-weight:800;color:#4caf50;font-size:15px}
.standings-wrap .group-title{color:#ffd740;font-weight:700;font-size:14px;padding:12px 0 6px;letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.standings-wrap .group-title::before{content:'🏆';font-size:16px}

.season-notice{background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.1);border-radius:12px;padding:16px 20px;text-align:center;margin:8px 0 12px;color:#ffd740;font-size:13px}
.season-notice .icon{font-size:24px;display:block;margin-bottom:4px}
.season-notice .sub{color:#888;font-size:12px;margin-top:2px}
.season-notice .date{color:#4caf50;font-weight:700}

.details{margin:6px 0}
.details summary{color:#4caf50;cursor:pointer;padding:12px 0;font-size:15px;font-weight:700;transition:color 0.2s;display:flex;align-items:center;gap:8px;list-style:none}
.details summary::-webkit-details-marker{display:none}
.details summary:hover{color:#a5d6a7}
.details summary::after{content:'▾';margin-left:auto;font-size:12px;color:#444;transition:transform 0.3s}
.details[open] summary::after{transform:rotate(180deg)}
.group-title{color:#ffd740;margin:16px 0 8px;font-weight:700;font-size:14px;letter-spacing:0.3px;display:flex;align-items:center;gap:8px}
.team-badge{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;text-transform:uppercase}
.ld{text-align:center;padding:60px 20px;color:#444;font-size:14px;font-weight:500}
.empty{text-align:center;padding:60px 20px;color:#333;font-size:14px;font-weight:500}

.footer-note{margin-top:50px;padding:20px;background:rgba(255,255,255,0.01);border-radius:16px;border:1px solid rgba(255,255,255,0.02);text-align:center;position:relative;z-index:2}
.footer-note p{color:#222;font-size:11px;line-height:1.8}
.footer-note a{color:#ffd740;text-decoration:none;transition:color 0.2s}
.footer-note a:hover{color:#fff3b0;text-decoration:underline}

#backTop{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,#4caf50,#2e7d32);border:none;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;box-shadow:0 4px 25px rgba(76,175,80,0.2);color:#fff;transition:all 0.3s ease;display:none;z-index:999}
#backTop:hover{transform:scale(1.1) translateY(-4px);box-shadow:0 8px 40px rgba(76,175,80,0.3)}

<script>
/* ================================================================
 * 工具函数
 * ================================================================ */
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function getTeamBadge(name, size) {
  if (!name || name === '?' || name === 'Unknown') return '';
  size = size || 24;
  var fontSize = size >= 24 ? 10 : 8;
  var letter = name.charAt(0).toUpperCase();
  var colors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e84393','#00b894','#6c5ce7','#fd79a8','#0984e3','#fdcb6e','#e17055','#00cec9'];
  var idx = 0;
  for (var i = 0; i < name.length; i++) idx += name.charCodeAt(i);
  var color = colors[idx % colors.length];
  return '<span class="team-badge" style="background:' + color + ';width:' + size + 'px;height:' + size + 'px;font-size:' + fontSize + 'px;">' + escapeHtml(letter) + '</span>';
}

function showModal(title, html) {
  var old = document.querySelector('.modal-overlay');
  if (old) old.remove();
  var div = document.createElement('div');
  div.className = 'modal-overlay';
  div.innerHTML = '<div class="modal-box"><button class="close" type="button">✕</button><h3>' + escapeHtml(title) + '</h3><div id="modalBody">' + html + '</div></div>';
  document.body.appendChild(div);
  div.querySelector('.close').addEventListener('click', function() { div.remove(); });
  div.addEventListener('click', function(e) { if (e.target === this) this.remove(); });
}

/* ================================================================
 * 核心数据
 * ================================================================ */
var matchData = { m: [], t: [] };
var currentLeague = 'bl1';
var offsetG = 8;
var offsetESPN = 8;

// 修复 #1：请求序号，防止竞态
var matchRequestId = 0;

/* ================================================================
 * 球队 Logo 缓存
 * ================================================================ */
var teamLogoCache = {};
try {
  var savedLogos = JSON.parse(localStorage.getItem('teamLogoCache') || '{}');
  for (var _k in savedLogos) {
    if (savedLogos[_k]) teamLogoCache[_k] = savedLogos[_k];
  }
  console.log('已恢复队徽缓存 ' + Object.keys(teamLogoCache).length + ' 条');
} catch(e) { console.warn('恢复队徽缓存失败:', e.message); }

function saveTeamLogoCache() {
  try {
    localStorage.setItem('teamLogoCache', JSON.stringify(teamLogoCache));
  } catch(e) { console.warn('保存队徽缓存失败:', e.message); }
}

/* ================================================================
 * 球队名翻译
 * 修复 #16：改为精确匹配 + 长名优先，避免曼联变曼城
 * ================================================================ */
var TEAM_NAME_MAP = {
  'Manchester City':'曼城','Arsenal':'阿森纳','Liverpool':'利物浦','Chelsea':'切尔西',
  'Tottenham':'热刺','Newcastle':'纽卡斯尔','Manchester United':'曼联',
  'Aston Villa':'阿斯顿维拉','West Ham':'西汉姆联','Brighton':'布莱顿','Wolves':'狼队',
  'Crystal Palace':'水晶宫','Fulham':'富勒姆','Brentford':'布伦特福德','Everton':'埃弗顿',
  'Bournemouth':'伯恩茅斯','Nottingham Forest':'诺丁汉森林','Ipswich':'伊普斯维奇',
  'Leicester':'莱斯特城','Southampton':'南安普顿',
  'Real Madrid':'皇家马德里','Barcelona':'巴塞罗那','Atletico Madrid':'马德里竞技',
  'Athletic Club':'毕尔巴鄂','Real Sociedad':'皇家社会','Sevilla':'塞维利亚',
  'Valencia':'瓦伦西亚','Villarreal':'比利亚雷亚尔','Real Betis':'贝蒂斯','Girona':'赫罗纳',
  'Osasuna':'奥萨苏纳','Celta Vigo':'塞尔塔','Mallorca':'马略卡','Rayo Vallecano':'巴列卡诺',
  'Las Palmas':'拉斯帕尔马斯','Alaves':'阿拉维斯','Leganes':'莱加内斯','Espanyol':'西班牙人',
  'Getafe':'赫塔菲','Valladolid':'巴拉多利德',
  'Inter Milan':'国际米兰','AC Milan':'AC米兰','Juventus':'尤文图斯','Roma':'罗马',
  'Napoli':'那不勒斯','Lazio':'拉齐奥','Atalanta':'亚特兰大','Fiorentina':'佛罗伦萨',
  'Bologna':'博洛尼亚','Torino':'都灵','Genoa':'热那亚','Monza':'蒙扎','Verona':'维罗纳',
  'Lecce':'莱切','Udinese':'乌迪内斯','Cagliari':'卡利亚里','Empoli':'恩波利',
  'Parma':'帕尔马','Como':'科莫','Venezia':'威尼斯',
  'PSG':'巴黎圣日耳曼','Monaco':'摩纳哥','Lyon':'里昂','Marseille':'马赛','Lille':'里尔',
  'Nice':'尼斯','Lens':'朗斯','Rennes':'雷恩','Strasbourg':'斯特拉斯堡','Nantes':'南特',
  'Reims':'兰斯','Brest':'布雷斯特','Toulouse':'图卢兹','Montpellier':'蒙彼利埃',
  'Clermont':'克莱蒙','Lorient':'洛里昂','Troyes':'特鲁瓦','Ajaccio':'阿雅克肖',
  'Auxerre':'欧塞尔','Angers':'昂热',
  'Dortmund':'多特蒙德','Bayern Munich':'拜仁慕尼黑','Leverkusen':'勒沃库森','Benfica':'本菲卡'
};

// 按 key 长度降序排列，保证长名优先匹配
var TEAM_NAME_KEYS_SORTED = Object.keys(TEAM_NAME_MAP).sort(function(a, b) {
  return b.length - a.length;
});

function translateTeamName(en) {
  if (!en) return '';
  // 1) 精确匹配
  if (TEAM_NAME_MAP[en]) return TEAM_NAME_MAP[en];
  // 2) 长名优先的包含匹配（用词边界避免误匹配）
  for (var i = 0; i < TEAM_NAME_KEYS_SORTED.length; i++) {
    var k = TEAM_NAME_KEYS_SORTED[i];
    // 用 \b 或首尾边界，避免 "Manchester" 命中 "Manchester United"
    var re = new RegExp('(^|[^A-Za-z])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^A-Za-z]|$)');
    if (re.test(en)) return TEAM_NAME_MAP[k];
  }
  return en;
}

/* ================================================================
 * 队徽提取
 * ================================================================ */
function extractLogosFromMatches() {
  var m = matchData.m || [];
  for (var i = 0; i < m.length; i++) {
    var c = m[i].competitions ? m[i].competitions[0] : null;
    if (!c || !c.competitors) continue;
    for (var j = 0; j < c.competitors.length; j++) {
      var team = c.competitors[j].team;
      if (team && team.logo) {
        if (team.displayName && !teamLogoCache[team.displayName]) teamLogoCache[team.displayName] = team.logo;
        if (team.shortDisplayName && team.shortDisplayName !== team.displayName && !teamLogoCache[team.shortDisplayName]) {
          teamLogoCache[team.shortDisplayName] = team.logo;
        }
      }
    }
  }
  saveTeamLogoCache();
}

/* ================================================================
 * 预抓全联赛队徽
 * ================================================================ */
var prefetchedLeagues = {};

async function prefetchLeagueLogos(leagueCode) {
  if (prefetchedLeagues[leagueCode]) return;
  try {
    var url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/' + leagueCode + '/teams';
    var resp = await fetch(url);
    var data = await resp.json();

    var teams = null;
    if (data.sports && data.sports[0] && data.sports[0].leagues && data.sports[0].leagues[0]) {
      teams = data.sports[0].leagues[0].teams;
    }
    if (!teams) return;

    var added = 0;
    for (var i = 0; i < teams.length; i++) {
      var t = teams[i].team;
      if (!t || !t.logos || t.logos.length === 0) continue;
      var logoUrl = t.logos[0].href || t.logos[0].url;
      if (!logoUrl) continue;

      if (t.displayName && !teamLogoCache[t.displayName]) { teamLogoCache[t.displayName] = logoUrl; added++; }
      if (t.shortDisplayName && t.shortDisplayName !== t.displayName && !teamLogoCache[t.shortDisplayName]) {
        teamLogoCache[t.shortDisplayName] = logoUrl;
      }
      if (t.name && !teamLogoCache[t.name]) { teamLogoCache[t.name] = logoUrl; }
      if (t.abbreviation && !teamLogoCache[t.abbreviation]) { teamLogoCache[t.abbreviation] = logoUrl; }
    }

    prefetchedLeagues[leagueCode] = true;

    if (added > 0) {
      saveTeamLogoCache();
      console.log('预抓队徽 [' + leagueCode + '] 新增 ' + added + ' 条');
      if (['bl1','bl2','bl3'].indexOf(currentLeague) === -1) {
        renderCustomMatches();
      }
    }
  } catch(e) {
    console.warn('预抓队徽失败 [' + leagueCode + ']:', e.message);
  }
}

// 修复 #6：优先精确匹配，模糊匹配加长度约束
function getTeamLogoUrl(teamName) {
  if (!teamName) return null;
  // 1) 精确匹配
  if (teamLogoCache[teamName]) return teamLogoCache[teamName];
  // 2) 大小写不敏感精确匹配
  var lowerName = teamName.toLowerCase();
  for (var key in teamLogoCache) {
    if (key.toLowerCase() === lowerName) return teamLogoCache[key];
  }
  // 3) 模糊匹配：双向 indexOf，但要求长度差 >= 3，避免 "Inter" 命中 "Inter Miami"
  for (var key2 in teamLogoCache) {
    var keyLower = key2.toLowerCase();
    if (Math.abs(keyLower.length - lowerName.length) < 3) {
      // 长度接近，允许双向包含
      if (lowerName.indexOf(keyLower) !== -1 || keyLower.indexOf(lowerName) !== -1) {
        return teamLogoCache[key2];
      }
    }
  }
  return null;
}

function getTeamLogoHtml(teamName, size) {
  size = size || 22;
  var logo = getTeamLogoUrl(teamName);
  if (logo) {
    return '<img src="' + escapeHtml(logo) + '" class="team-logo-img" style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,0.02);padding:2px;flex-shrink:0;" onerror="this.style.display=\'none\'">';
  }
  var colors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e84393','#00b894','#6c5ce7','#fd79a8','#0984e3','#fdcb6e','#e17055','#00cec9'];
  var idx = 0;
  for (var i = 0; i < teamName.length; i++) idx += teamName.charCodeAt(i);
  var color = colors[idx % colors.length];
  var letter = teamName.charAt(0).toUpperCase();
  var fontSize = size >= 24 ? 10 : 8;
  return '<span class="team-logo-fallback" style="background:' + color + ';width:' + size + 'px;height:' + size + 'px;font-size:' + fontSize + 'px;">' + escapeHtml(letter) + '</span>';
}

/* ================================================================
 * 时区格式化
 * 修复 #8：显式处理 null/undefined
 * ================================================================ */
function fmt(dateStr, offset) {
  if (dateStr === null || dateStr === undefined || dateStr === '') {
    return { date: '--/--', time: '--:--' };
  }
  var d = new Date(dateStr);
  if (isNaN(d.getTime())) {
    return { date: '--/--', time: '--:--' };
  }
  var d2 = new Date(d.getTime() + offset * 3600000);
  var month = String(d2.getUTCMonth() + 1).padStart(2, '0');
  var day = String(d2.getUTCDate()).padStart(2, '0');
  var hours = String(d2.getUTCHours()).padStart(2, '0');
  var minutes = String(d2.getUTCMinutes()).padStart(2, '0');
  return { date: month + '/' + day, time: hours + ':' + minutes };
}

/* ================================================================
 * 联赛切换
 * ================================================================ */
function setLeague(l) {
  currentLeague = l;
  var btns = document.querySelectorAll('#leagueNav button');
  for (var i = 0; i < btns.length; i++) btns[i].className = '';
  var target = document.querySelector('#leagueNav button[onclick="setLeague(\'' + l + '\')"]');
  if (target) target.className = 'on';
  document.getElementById('searchInput').value = '';
  refreshMatches();
}

// 修复 #15：时区上下限
var MIN_OFFSET = -12, MAX_OFFSET = 14;
function clampOffset(v) {
  if (v < MIN_OFFSET) return MIN_OFFSET;
  if (v > MAX_OFFSET) return MAX_OFFSET;
  return v;
}
function adjustG(delta) {
  offsetG = clampOffset(offsetG + delta);
  updateDisplay('tzDisplayG', offsetG);
  if (['bl1','bl2','bl3'].indexOf(currentLeague) !== -1) renderGermanMatches();
}
function resetG() { offsetG = 8; updateDisplay('tzDisplayG', 8); if (['bl1','bl2','bl3'].indexOf(currentLeague) !== -1) renderGermanMatches(); }
function adjustESPN(delta) {
  offsetESPN = clampOffset(offsetESPN + delta);
  updateDisplay('tzDisplayESPN', offsetESPN);
  if (['ENG.1','ESP.1','ITA.1','FRA.1','UCL','UEL'].indexOf(currentLeague) !== -1) renderCustomMatches();
}
function resetESPN() { offsetESPN = 8; updateDisplay('tzDisplayESPN', 8); if (['ENG.1','ESP.1','ITA.1','FRA.1','UCL','UEL'].indexOf(currentLeague) !== -1) renderCustomMatches(); }
function updateDisplay(id, val) {
  var el = document.getElementById(id);
  if (!el) return;
  if (val === 0) el.textContent = '+0h';
  else if (val > 0) el.textContent = '+' + val + 'h';
  else el.textContent = val + 'h';
}

/* ================================================================
 * 直播检测
 * ================================================================ */
function hasLiveMatches() {
  var m = matchData.m || [];
  var isGerman = ['bl1','bl2','bl3'].indexOf(currentLeague) !== -1;
  for (var i = 0; i < m.length; i++) {
    var match = m[i];
    if (isGerman) {
      if (!match.matchIsFinished && match.matchResults && match.matchResults.length > 0) return true;
    } else {
      if (match.status && match.status.type && match.status.type.state === 'in') return true;
    }
  }
  return false;
}

// 修复 #11：单向状态更新，避免递归
function updateLiveButton() {
  var btn = document.getElementById('autoRefreshBtn');
  var status = document.getElementById('autoStatus');
  var label = document.getElementById('autoLabel');
  var countdown = document.getElementById('autoCountdown');
  if (!btn) return;
  var hasLive = hasLiveMatches();

  if (!hasLive) {
    // 无直播：强制关闭自动刷新（直接清理，不调用 toggleAutoRefresh 避免递归）
    if (autoRefreshEnabled) {
      _stopAutoRefresh();
    }
    btn.className = 'disabled';
    status.style.background = '#444';
    status.className = '';
    label.textContent = '⏸️ 无直播';
    countdown.textContent = '';
  } else {
    if (!autoRefreshEnabled) {
      btn.className = '';
      status.style.background = '#444';
      status.className = '';
      label.textContent = '⏸️ 直播';
      countdown.textContent = '';
    }
  }
}

/* ================================================================
 * 数据获取
 * 修复 #1：加 requestId 防竞态
 * ================================================================ */
async function refreshMatches() {
  var myRequestId = ++matchRequestId;
  document.getElementById('matchMain').innerHTML = '<div class="ld"><div class="spinner"></div><br>加载比赛数据...</div>';
  try {
    if (['bl1','bl2','bl3'].indexOf(currentLeague) !== -1) {
      var year = new Date().getFullYear();
      var r1 = await fetch('https://api.openligadb.de/getmatchdata/' + currentLeague);
      var r2 = await fetch('https://api.openligadb.de/getbltable/' + currentLeague + '/' + year);
      var m1 = await r1.json();
      var t1 = await r2.json();
      // 竞态检查：如果在等待期间用户切换了联赛，丢弃本次结果
      if (myRequestId !== matchRequestId) return;
      matchData.m = m1;
      matchData.t = t1;
      renderGermanMatches();
    } else {
      var leagueCode = currentLeague;
      if (currentLeague === 'UCL') leagueCode = 'UEFA.CHAMPIONS';
      else if (currentLeague === 'UEL') leagueCode = 'UEFA.EUROPA';

      var r3 = fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/' + leagueCode + '/scoreboard');
      var r4 = fetch('https://site.api.espn.com/apis/v2/sports/soccer/' + leagueCode + '/standings');

      var results = await Promise.all([r3, r4]);
      var scoreboardData = await results[0].json();
      var standingsData = await results[1].json();

      // 竞态检查
      if (myRequestId !== matchRequestId) return;

      matchData.m = scoreboardData.events || [];
      matchData.t = standingsData.children || [];

      extractLogosFromMatches();
      renderCustomMatches();

      prefetchLeagueLogos(leagueCode);
    }
    updateLiveButton();
  } catch(e) {
    if (myRequestId !== matchRequestId) return;
    document.getElementById('matchMain').innerHTML = '<div class="ld">❌ 错误: ' + escapeHtml(e.message) + '<br><span style="color:#666;font-size:12px;">请检查网络连接后刷新</span><br><button onclick="refreshMatches()" style="margin-top:14px;padding:10px 28px;background:linear-gradient(135deg,#4caf50,#2e7d32);border:none;border-radius:30px;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(76,175,80,0.15)">🔄 重试</button></div>';
  }
}

async function refreshLiveMatches() {
  try {
    if (!hasLiveMatches()) {
      if (autoRefreshEnabled) _stopAutoRefresh();
      updateLiveButton();
      return;
    }
    if (['bl1','bl2','bl3'].indexOf(currentLeague) !== -1) {
      var r = await fetch('https://api.openligadb.de/getmatchdata/' + currentLeague);
      var newData = await r.json();
      for (var i = 0; i < matchData.m.length; i++) {
        var matchId = matchData.m[i].matchID;
        if (!matchId) continue;
        for (var j = 0; j < newData.length; j++) {
          if (newData[j].matchID === matchId) { matchData.m[i] = newData[j]; break; }
        }
      }
      renderGermanMatches();
    } else {
      var leagueCode = currentLeague;
      if (currentLeague === 'UCL') leagueCode = 'UEFA.CHAMPIONS';
      else if (currentLeague === 'UEL') leagueCode = 'UEFA.EUROPA';
      var resp = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/' + leagueCode + '/scoreboard');
      var data = await resp.json();
      var newEvents = data.events || [];
      for (var i2 = 0; i2 < matchData.m.length; i2++) {
        var oldId = matchData.m[i2].id;
        if (!oldId) continue;
        for (var j2 = 0; j2 < newEvents.length; j2++) {
          if (newEvents[j2].id === oldId) { matchData.m[i2] = newEvents[j2]; break; }
        }
      }
      extractLogosFromMatches();
      renderCustomMatches();
    }
    updateLiveButton();
  } catch(e) { console.warn('直播刷新失败:', e.message); }
}

/* ================================================================
 * 自动刷新
 * 修复 #14：用时间戳计算倒计时，避免跳变
 * ================================================================ */
var autoRefreshEnabled = false;
var autoRefreshTimer = null;
var countdownTimer = null;
var nextRefreshAt = 0;
var REFRESH_INTERVAL_MS = 15000;

function _startAutoRefresh() {
  autoRefreshEnabled = true;
  var btn = document.getElementById('autoRefreshBtn');
  var status = document.getElementById('autoStatus');
  var label = document.getElementById('autoLabel');
  var countdown = document.getElementById('autoCountdown');
  btn.className = 'active';
  status.style.background = '#4caf50';
  status.className = 'pulse';
  label.textContent = '● 直播中';
  countdown.textContent = '15s';

  nextRefreshAt = Date.now() + REFRESH_INTERVAL_MS;
  refreshLiveMatches();

  autoRefreshTimer = setInterval(function() {
    refreshLiveMatches();
    nextRefreshAt = Date.now() + REFRESH_INTERVAL_MS;
  }, REFRESH_INTERVAL_MS);

  countdownTimer = setInterval(function() {
    var remain = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
    var el = document.getElementById('autoCountdown');
    if (el) el.textContent = remain + 's';
  }, 500);
}

function _stopAutoRefresh() {
  autoRefreshEnabled = false;
  var btn = document.getElementById('autoRefreshBtn');
  var status = document.getElementById('autoStatus');
  var label = document.getElementById('autoLabel');
  var countdown = document.getElementById('autoCountdown');
  if (btn) btn.className = '';
  if (status) { status.style.background = '#444'; status.className = ''; }
  if (label) label.textContent = '⏸️ 直播';
  if (countdown) countdown.textContent = '';
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
}

function toggleAutoRefresh() {
  if (!hasLiveMatches() && !autoRefreshEnabled) return;
  if (autoRefreshEnabled) {
    _stopAutoRefresh();
    updateLiveButton();
  } else {
    _startAutoRefresh();
  }
}

/* ================================================================
 * 德甲/德乙/德丙 渲染
 * ================================================================ */
function renderGermanMatches() {
  var s = document.getElementById('searchInput').value.toLowerCase();
  var m = matchData.m || [], t = matchData.t || [];
  if (s) {
    m = m.filter(function(x) {
      return (x.team1 && x.team1.teamName || '').toLowerCase().indexOf(s) !== -1 ||
             (x.team2 && x.team2.teamName || '').toLowerCase().indexOf(s) !== -1;
    });
  }
  var h = '';

  if (t && t.length) {
    h += '<details class="details" open><summary>📈 积分榜</summary><div class="standings-wrap"><div class="table-scroll"><table><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进球</th><th>失球</th><th>净胜</th><th>积分</th></tr>';
    for (var i = 0; i < t.length; i++) {
      var r = t[i];
      var icon = '';
      if (r.teamIconUrl) {
        icon = '<img src="' + escapeHtml(r.teamIconUrl) + '" style="width:22px;height:22px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,0.02);padding:2px;flex-shrink:0;" loading="lazy" onerror="this.style.display=\'none\'">';
      }
      if (!icon && r.teamName) {
        icon = getTeamBadge(r.teamName, 22);
      }
      var rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
      var gdClass = r.goalDiff > 0 ? 'gd-positive' : r.goalDiff < 0 ? 'gd-negative' : 'gd-zero';
      h += '<tr><td><span class="rank ' + rankClass + '">' + (i + 1) + '</span></td><td><div class="team-cell">' + icon + '<span>' + escapeHtml(r.teamName) + '</span></div></td><td class="stat">' + r.matches + '</td><td class="stat">' + r.won + '</td><td class="stat">' + r.draw + '</td><td class="stat">' + r.lost + '</td><td class="stat">' + r.goals + '</td><td class="stat">' + r.opponentGoals + '</td><td class="' + gdClass + '">' + (r.goalDiff > 0 ? '+' : '') + r.goalDiff + '</td><td class="points">' + r.points + '</td></tr>';
    }
    h += '</table></div></div></details>';
  }

  m = m.slice().sort(function(a, b) {
    return new Date(a.matchDateTime) - new Date(b.matchDateTime);
  });

  var live = m.filter(function(x) { return !x.matchIsFinished && x.matchResults && x.matchResults.length > 0; });
  var done = m.filter(function(x) { return x.matchIsFinished; });
  var up = m.filter(function(x) { return !x.matchIsFinished && (!x.matchResults || x.matchResults.length === 0); });

  // 修复 #10：搜索时不做 slice 截断
  var limitUp = s ? up.length : 12;
  var limitDone = s ? done.length : 12;

  if (live.length) h += '<div class="section-title"><span class="dot" style="background:#ff5252;animation:blink 1.2s infinite;"></span> 直播中</div><div class="grid">' + live.map(function(x) { return cardGerman(x, 'live'); }).join('') + '</div>';
  if (up.length) h += '<div class="section-title"><span class="dot" style="background:#4caf50;"></span> 即将开始</div><div class="grid">' + up.slice(0, limitUp).map(function(x) { return cardGerman(x, 'upcoming'); }).join('') + '</div>';
  if (done.length) h += '<div class="section-title"><span class="dot" style="background:#333;"></span> 已结束</div><div class="grid">' + done.slice(-limitDone).map(function(x) { return cardGerman(x, 'finished'); }).join('') + '</div>';

  document.getElementById('matchMain').innerHTML = h || '<div class="ld">暂无数据</div>';
}

function cardGerman(m, status) {
  var ft = fmt(m.matchDateTime, offsetG);
  var ds = ft.date, ts = ft.time;
  var live = status === 'live';
  var done = status === 'finished';
  var sc = 'VS', cl = '';
  var name1 = m.team1 ? m.team1.teamName : '?';
  var name2 = m.team2 ? m.team2.teamName : '?';
  var teamId1 = m.team1 ? m.team1.teamId : null;
  var teamId2 = m.team2 ? m.team2.teamId : null;

  function findGermanLogo(teamName) {
    if (!teamName || teamName === '?') return '';
    if (m.team1 && m.team1.teamName === teamName && m.team1.teamIconUrl) return m.team1.teamIconUrl;
    if (m.team2 && m.team2.teamName === teamName && m.team2.teamIconUrl) return m.team2.teamIconUrl;
    var table = matchData.t || [];
    var clean = teamName.replace(/[^a-zA-Z0-9äöüÄÖÜß]/g, '').toLowerCase();
    // 修复 #9：先精确匹配，再模糊匹配
    for (var i = 0; i < table.length; i++) {
      var row = table[i];
      if (row.teamName === teamName && row.teamIconUrl) return row.teamIconUrl;
    }
    for (var i2 = 0; i2 < table.length; i2++) {
      var row2 = table[i2];
      if (!row2.teamIconUrl || !row2.teamName) continue;
      var rowClean = row2.teamName.replace(/[^a-zA-Z0-9äöüÄÖÜß]/g, '').toLowerCase();
      if (rowClean === clean) return row2.teamIconUrl;
    }
    return '';
  }

  var icon1 = '', icon2 = '';
  var logo1 = findGermanLogo(name1);
  var logo2 = findGermanLogo(name2);
  if (logo1) {
    icon1 = '<img src="' + escapeHtml(logo1) + '" style="width:24px;height:24px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,0.02);padding:2px;flex-shrink:0;" loading="lazy" onerror="this.style.display=\'none\'">';
  } else if (name1 !== '?') {
    icon1 = getTeamBadge(name1, 24);
  }
  if (logo2) {
    icon2 = '<img src="' + escapeHtml(logo2) + '" style="width:24px;height:24px;border-radius:50%;object-fit:contain;background:rgba(255,255,255,0.02);padding:2px;flex-shrink:0;" loading="lazy" onerror="this.style.display=\'none\'">';
  } else if (name2 !== '?') {
    icon2 = getTeamBadge(name2, 24);
  }

  var display1 = icon1 + ' <span class="team-link" onclick="showTeamInfo(\'' + teamId1 + '\',\'' + escapeHtml(name1) + '\')">' + escapeHtml(name1) + ' <span class="info-icon">ℹ️</span></span>';
  var display2 = icon2 + ' <span class="team-link" onclick="showTeamInfo(\'' + teamId2 + '\',\'' + escapeHtml(name2) + '\')">' + escapeHtml(name2) + ' <span class="info-icon">ℹ️</span></span>';

  if (done || live) {
    var r = null;
    if (m.matchResults) {
      for (var i = 0; i < m.matchResults.length; i++) {
        if (m.matchResults[i].resultName === 'Endergebnis') { r = m.matchResults[i]; break; }
      }
      if (!r) r = m.matchResults[0];
    }
    var hs = r ? (r.pointsTeam1 || 0) : 0, as = r ? (r.pointsTeam2 || 0) : 0;
    sc = hs + '-' + as;
    if (done) {
      if (hs > as) {
        display1 = icon1 + ' <span class="team-link" style="color:#4caf50;font-weight:700;" onclick="showTeamInfo(\'' + teamId1 + '\',\'' + escapeHtml(name1) + '\')">' + escapeHtml(name1) + ' ✔ <span class="info-icon">ℹ️</span></span>';
        display2 = icon2 + ' <span style="color:#555;">' + escapeHtml(name2) + '</span>';
        cl = 'score-finished';
      } else if (hs < as) {
        display1 = icon1 + ' <span style="color:#555;">' + escapeHtml(name1) + '</span>';
        display2 = icon2 + ' <span class="team-link" style="color:#4caf50;font-weight:700;" onclick="showTeamInfo(\'' + teamId2 + '\',\'' + escapeHtml(name2) + '\')">' + escapeHtml(name2) + ' ✔ <span class="info-icon">ℹ️</span></span>';
        cl = 'score-finished';
      } else {
        display1 = icon1 + ' <span class="team-link" style="color:#ffd740;font-weight:700;" onclick="showTeamInfo(\'' + teamId1 + '\',\'' + escapeHtml(name1) + '\')">' + escapeHtml(name1) + ' <span class="info-icon">ℹ️</span></span>';
        display2 = icon2 + ' <span class="team-link" style="color:#ffd740;font-weight:700;" onclick="showTeamInfo(\'' + teamId2 + '\',\'' + escapeHtml(name2) + '\')">' + escapeHtml(name2) + ' <span class="info-icon">ℹ️</span></span>';
        cl = 'score-finished';
      }
    } else { cl = 'score-live'; }
  }
  var statusTag = live ? '<span class="status-tag live">● 直播中</span>' : done ? '<span class="status-tag finished">✓ 已结束</span>' : '<span class="status-tag upcoming">⏰ 即将开始</span>';

  var rosterBtns = '';
  if (currentLeague === 'bl1') {
    rosterBtns = '<button onclick="showBundesligaRoster(\'' + escapeHtml(name1) + '\')">📋 ' + escapeHtml(name1) + '</button><button onclick="showBundesligaRoster(\'' + escapeHtml(name2) + '\')">📋 ' + escapeHtml(name2) + '</button>';
  }

  var botText = live ? '● 直播中' : done ? '✓ 已结束' : '';
  return '<div class="card"><div class="top"><span>' + ds + ' ' + ts + (m.group && m.group.groupName ? ' · ' + escapeHtml(m.group.groupName) : '') + '</span>' + statusTag + '</div><div class="row"><div class="side">' + display1 + '</div><div class="mid ' + cl + '">' + sc + '</div><div class="side r">' + display2 + '</div></div><div class="bot">' + botText + ' ' + rosterBtns + '</div></div>';
}

/* ================================================================
 * ESPN 积分榜字段辅助
 * ================================================================ */
function getStat(stats, names) {
  if (!stats) return null;
  for (var i = 0; i < stats.length; i++) {
    var n = (stats[i].name || '').toLowerCase();
    var ab = (stats[i].abbreviation || '').toLowerCase();
    for (var j = 0; j < names.length; j++) {
      if (n === names[j] || ab === names[j]) return stats[i];
    }
  }
  return null;
}

function statVal(stats, names, fallback) {
  var s = getStat(stats, names);
  if (!s) return fallback !== undefined ? fallback : '0';
  var v = s.displayValue !== undefined ? s.displayValue : s.value;
  if (v === undefined || v === null) return fallback !== undefined ? fallback : '0';
  return String(v);
}

/* ================================================================
 * 赛季判断
 * 修复 #3：优先看数据源是否返回积分榜，日期仅作兜底
 * ================================================================ */
function isSeasonStarted(hasStandingsData) {
  // 如果数据源已经有积分榜数据，说明赛季已经开始
  if (hasStandingsData) return true;
  // 兜底：8月15日之后算赛季开始
  var now = new Date();
  var month = now.getMonth() + 1;
  var day = now.getDate();
  if (month > 8 || (month === 8 && day >= 15)) return true;
  return false;
}

/* ================================================================
 * 五大联赛 + 欧战 渲染
 * ================================================================ */
function renderCustomMatches() {
  var s = document.getElementById('searchInput').value.toLowerCase();
  var m = matchData.m || [], t = matchData.t || [];

  if (s && m.length > 0) {
    m = m.filter(function(x) {
      var c = x.competitions ? x.competitions[0] : null;
      if (!c || !c.competitors || c.competitors.length < 2) return false;
      return c.competitors[0].team.displayName.toLowerCase().indexOf(s) !== -1 ||
             c.competitors[1].team.displayName.toLowerCase().indexOf(s) !== -1;
    });
  }

  var h = '';
  var isKnockout = (currentLeague === 'UCL' || currentLeague === 'UEL');

  if (isKnockout) {
    var competitionName = currentLeague === 'UCL' ? '欧冠' : '欧联';
    // 修复 #2：动态年份
    var nowY = new Date().getFullYear();
    var nowM = new Date().getMonth() + 1;
    // 如果当前是 1-8 月，说明本赛季从去年开始；否则从今年开始
    var seasonStartYear = nowM >= 9 ? nowY : nowY - 1;
    var seasonEndYear = seasonStartYear + 1;
    var startDate = currentLeague === 'UCL' ? (seasonStartYear + '年9月15日') : (seasonStartYear + '年9月16日');
    h += '<div class="season-notice" style="margin:12px 0;"><span class="icon">🏆</span>' + competitionName + ' ' + seasonStartYear + '-' + String(seasonEndYear).slice(-2) + ' 赛季为淘汰赛制<br><span class="sub">小组赛阶段将于 <span class="date">' + startDate + '</span> 开赛 · 敬请期待</span></div>';
  } else {
    // 先看数据源有没有积分榜数据
    var hasEspnStandings = false;
    var espnEntries = [];
    var leagueName = '积分榜';
    for (var gi = 0; gi < t.length; gi++) {
      var group = t[gi];
      if (group.standings && group.standings.entries && group.standings.entries.length > 0) {
        hasEspnStandings = true;
        espnEntries = group.standings.entries;
        leagueName = group.name || '积分榜';
        break;
      }
    }
    // 修复 #3：赛季判断改为数据优先
    var seasonStarted = isSeasonStarted(hasEspnStandings);

    if (hasEspnStandings && seasonStarted) {
      h += '<details class="details" open><summary>📈 积分榜 - ' + escapeHtml(leagueName) + '</summary>';
      h += '<div class="standings-wrap"><div class="table-scroll"><table><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进球</th><th>失球</th><th>净胜</th><th>积分</th></tr>';
      var logoDirty = false;
      for (var i = 0; i < espnEntries.length; i++) {
        var e = espnEntries[i];
        var stats = e.stats || [];
        var rawName = e.team ? (e.team.displayName || e.team.shortDisplayName || '未知') : '未知';
        var teamName = translateTeamName(rawName);
        var teamId = e.team ? e.team.id : null;

        if (e.team && e.team.logos && e.team.logos.length > 0) {
          var logoUrl = e.team.logos[0].href || e.team.logos[0].url;
          if (logoUrl && rawName && !teamLogoCache[rawName]) {
            teamLogoCache[rawName] = logoUrl;
            logoDirty = true;
          }
        }

        var played = statVal(stats, ['gamesplayed','gp','played'], '0');
        var won = statVal(stats, ['wins','w'], '0');
        var drawn = statVal(stats, ['ties','draws','d'], '0');
        var lost = statVal(stats, ['losses','l'], '0');
        var goalsFor = statVal(stats, ['pointsfor','goalsfor','gf','pf'], '0');
        var goalsAgainst = statVal(stats, ['pointsagainst','goalsagainst','ga','pa'], '0');
        var points = statVal(stats, ['points','pts','p'], '0');
        var goalDiffRaw = statVal(stats, ['pointdifferential','goaldifference','gd','diff'], '0');

        points = points.replace(/\+/g, '');
        goalDiffRaw = goalDiffRaw.replace(/\+/g, '');
        var gdNum = parseInt(goalDiffRaw, 10);
        if (isNaN(gdNum)) gdNum = 0;

        var rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
        var gdClass = gdNum > 0 ? 'gd-positive' : gdNum < 0 ? 'gd-negative' : 'gd-zero';
        var logoHtml = getTeamLogoHtml(rawName, 22);

        var leagueCode = currentLeague;
        if (currentLeague === 'UCL') leagueCode = 'UEFA.CHAMPIONS';
        else if (currentLeague === 'UEL') leagueCode = 'UEFA.EUROPA';

        h += '<tr><td><span class="rank ' + rankClass + '">' + (i + 1) + '</span></td>';
        h += '<td><div class="team-cell">' + logoHtml + '<span style="cursor:pointer;border-bottom:2px solid transparent;transition:all 0.25s ease;" onclick="showEspnRoster(\'' + leagueCode + '\',\'' + teamId + '\',\'' + escapeHtml(teamName) + '\')" onmouseover="this.style.borderBottomColor=\'#4caf50\';this.style.color=\'#a5d6a7\'" onmouseout="this.style.borderBottomColor=\'transparent\';this.style.color=\'#eee\'">' + escapeHtml(teamName) + ' ℹ️</span></div></td>';
        h += '<td class="stat">' + escapeHtml(played) + '</td>';
        h += '<td class="stat">' + escapeHtml(won) + '</td>';
        h += '<td class="stat">' + escapeHtml(drawn) + '</td>';
        h += '<td class="stat">' + escapeHtml(lost) + '</td>';
        h += '<td class="stat">' + escapeHtml(goalsFor) + '</td>';
        h += '<td class="stat">' + escapeHtml(goalsAgainst) + '</td>';
        h += '<td class="' + gdClass + '">' + (gdNum > 0 ? '+' : '') + gdNum + '</td>';
        h += '<td class="points">' + escapeHtml(points) + '</td></tr>';
      }
      h += '</table></div></div></details>';
      if (logoDirty) saveTeamLogoCache();
    } else if (!seasonStarted) {
      h += '<div class="season-notice" style="margin:12px 0;"><span class="icon">⏳</span>' + new Date().getFullYear() + ' 赛季尚未开始<br><span class="sub">当前为赛季备战期 · 积分榜暂为空</span></div>';
    } else {
      h += '<div class="season-notice" style="margin:12px 0;"><span class="icon">📊</span>积分榜数据加载中...<br><span class="sub">请稍后刷新页面</span></div>';
    }
  }

  // 修复 #12：兼容 postponed / canceled / suspended，避免比赛消失
  var live = [], done = [], up = [], other = [];
  for (var mi = 0; mi < m.length; mi++) {
    var x = m[mi];
    var state = x.status && x.status.type ? x.status.type.state : null;
    var completed = x.status && x.status.type ? x.status.type.completed === true : false;
    if (state === 'in') live.push(x);
    else if (state === 'post' || completed) done.push(x);
    else if (state === 'pre') up.push(x);
    else other.push(x);  // postponed / canceled / suspended 等
  }

  // 修复 #10：搜索时不做 slice 截断
  var limitUp = s ? up.length : 12;
  var limitDone = s ? done.length : 12;

  if (live.length) h += '<div class="section-title"><span class="dot" style="background:#ff5252;animation:blink 1.2s infinite;"></span> 直播中</div><div class="grid">' + live.map(function(x) { return cardCustom(x, 'live'); }).join('') + '</div>';
  if (up.length) h += '<div class="section-title"><span class="dot" style="background:#4caf50;"></span> 即将开始</div><div class="grid">' + up.slice(0, limitUp).map(function(x) { return cardCustom(x, 'upcoming'); }).join('') + '</div>';
  if (done.length) h += '<div class="section-title"><span class="dot" style="background:#333;"></span> 已结束</div><div class="grid">' + done.slice(-limitDone).map(function(x) { return cardCustom(x, 'finished'); }).join('') + '</div>';
  if (other.length) h += '<div class="section-title"><span class="dot" style="background:#666;"></span> 其他状态</div><div class="grid">' + other.map(function(x) { return cardCustom(x, 'other'); }).join('') + '</div>';

  document.getElementById('matchMain').innerHTML = h || '<div class="ld">暂无数据</div>';
}

async function fetchWithProxy(url) {
  var proxies = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?url=',
    'https://api.codetabs.com/v1/proxy?quest='
  ];
  for (var p = 0; p < proxies.length; p++) {
    try {
      var proxyUrl = proxies[p] + encodeURIComponent(url);
      var controller = new AbortController();
      var timeout = setTimeout(function() { controller.abort(); }, 15000);
      var response = await fetch(proxyUrl, { signal: controller.signal });
      clearTimeout(timeout);
      if (response.ok) {
        var text = await response.text();
        if (text && (text.indexOf('<rss') !== -1 || text.indexOf('<feed') !== -1 || text.indexOf('<item') !== -1)) {
          return text;
        }
      }
    } catch(e) { console.warn('代理 ' + p + ' 失败: ' + e.message); }
  }
  return null;
}

function parseRSS(xml, sourceName) {
  if (!xml) return [];
  var parser = new DOMParser();
  var doc = parser.parseFromString(xml, 'text/xml');
  // 修复 #18：同时兼容 RSS 2.0 的 <item> 和 Atom 的 <entry>
  var items = doc.querySelectorAll('item');
  if (items.length === 0) {
    items = doc.querySelectorAll('entry');
  }
  var results = [];
  items.forEach(function(item) {
    var titleEl = item.querySelector('title');
    var linkEl = item.querySelector('link');
    var dateEl = item.querySelector('pubDate') || item.querySelector('updated');
    var descEl = item.querySelector('description') || item.querySelector('summary') || item.querySelector('content');
    var title = titleEl ? titleEl.textContent : '';
    var link = '';
    if (linkEl) {
      link = linkEl.textContent || linkEl.getAttribute('href') || '';
    }
    var pubDate = dateEl ? dateEl.textContent : '';
    var description = descEl ? descEl.textContent : '';
    var cleanDesc = description.replace(/<[^>]*>/g, '').trim();
    var summary = cleanDesc || title;
    if (summary.length > 150) summary = summary.substring(0, 150) + '...';
    var isFootball = FOOTBALL_KEYWORDS.some(function(kw) {
      return title.toLowerCase().indexOf(kw.toLowerCase()) !== -1 || summary.toLowerCase().indexOf(kw.toLowerCase()) !== -1;
    });
    if (isFootball && title && link) {
      results.push({ title: title, link: link, pubDate: pubDate, summary: summary, source: sourceName });
    }
  });
  return results;
}

async function fetchRSSSource(source) {
  try {
    var xml = await fetchWithProxy(source.url);
    return parseRSS(xml, source.name);
  } catch(e) { return []; }
}

// 修复 #17：ESPN 新闻加足球关键词过滤
async function fetchESPNNews(source) {
  try {
    var url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/' + source.league + '/news';
    var resp = await fetch(url);
    var data = await resp.json();

    if (!data.articles || !Array.isArray(data.articles)) return [];

    var results = [];
    for (var i = 0; i < data.articles.length; i++) {
      var a = data.articles[i];
      if (!a.headline || !a.links) continue;

      var link = '';
      if (a.links && a.links.web && a.links.web.href) link = a.links.web.href;
      if (!link && a.links && a.links.mobile && a.links.mobile.href) link = a.links.mobile.href;
      if (!link) continue;

      var summary = a.description || a.headline;
      if (summary.length > 150) summary = summary.substring(0, 150) + '...';

      // 足球关键词过滤
      var text = (a.headline + ' ' + summary).toLowerCase();
      var isFootball = FOOTBALL_KEYWORDS.some(function(kw) {
        return text.indexOf(kw.toLowerCase()) !== -1;
      });
      if (!isFootball) continue;

      results.push({
        title: a.headline,
        link: link,
        pubDate: a.published || a.lastModified || new Date().toUTCString(),
        summary: summary,
        source: source.name
      });
    }
    return results;
  } catch(e) {
    console.warn('ESPN 新闻抓取失败 [' + source.league + ']:', e.message);
    return [];
  }
}

async function fetchAllRumors() {
  if (isLoadingRumors) return;
  isLoadingRumors = true;
  var statusEl = document.getElementById('rumorStatus');
  if (statusEl) statusEl.textContent = '加载 RSS...';
  document.getElementById('rumorMain').innerHTML = '<div class="ld"><div class="spinner"></div><br>加载足球新闻...</div>';
  allRumors = [];

  var rssPromises = RSS_SOURCES.map(function(source) { return fetchRSSSource(source); });
  var espnPromises = ESPN_NEWS_LEAGUES.map(function(source) { return fetchESPNNews(source); });

  var allResults = await Promise.all(rssPromises.concat(espnPromises));
  allResults.forEach(function(items) { allRumors = allRumors.concat(items); });

  var seen = new Set();
  allRumors = allRumors.filter(function(item) {
    var key = item.title.substring(0, 60).toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  allRumors.sort(function(a, b) {
    var da = new Date(a.pubDate);
    var db = new Date(b.pubDate);
    if (isNaN(da.getTime())) return 1;
    if (isNaN(db.getTime())) return -1;
    return db - da;
  });
  if (allRumors.length === 0) {
    allRumors = [
      { title: 'Sky Sports Football - Latest News', link: 'https://www.skysports.com/football', pubDate: new Date().toUTCString(), summary: 'Latest football news, transfers, scores and more from Sky Sports.', source: 'Sky Sports' },

    ];
  }
  renderRumors();
  isLoadingRumors = false;
  if (statusEl) statusEl.textContent = '已更新 (' + allRumors.length + '条)';
  document.getElementById('rumorCount').textContent = allRumors.length + ' 条新闻';

    var tagNames = { 'all': '全部', 'transfer': '转会', 'match': '比赛', 'injury': '伤病', 'title': '冠军', 'club': '俱乐部' };
    var tagDisplay = tagNames[currentRumorTag] || '全部';
    main.innerHTML = '<div class="empty">暂无 ' + tagDisplay + ' 新闻<br><span style="font-size:12px;color:#222;">点击「刷新」获取最新 RSS</span></div>';
    return;
  }
  var html = '<div class="grid">';
  filtered.forEach(function(item) {
    var date = new Date(item.pubDate);
    var timeStr = isNaN(date.getTime()) ? '' : date.toLocaleDateString('zh-CN', {month:'short', day:'numeric'}) + ' ' + date.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    var safeLink = escapeHtml(item.link || '#');
    var icons = { 'Sky Sports': '🎯', 'Transfermarkt': '⚽', 'BBC Sport': '📺' };
    var icon = icons[item.source] || (item.source.indexOf('ESPN') === 0 ? '📡' : '📰');
    var detectedTag = detectNewsTag(item.title + ' ' + item.summary);
    var tagDisplay = detectedTag ? '<span class="news-tag">' + detectedTag + '</span>' : '';
    html += '<div class="card"><div class="source-row"><span class="source">' + icon + ' ' + escapeHtml(item.source) + '</span>' + (timeStr ? '<span class="source-tag">' + escapeHtml(timeStr) + '</span>' : '') + '</div><div class="title"><a href="' + safeLink + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(item.title) + '</a></div>' + (item.summary ? '<div class="summary">' + escapeHtml(item.summary) + '</div>' : '') + '<div class="meta"><a href="' + safeLink + '" target="_blank" rel="noopener noreferrer" class="read-link">📖 阅读原文 →</a>' + tagDisplay + '</div></div>';
  });
  html += '</div>';
  main.innerHTML = html;
  document.getElementById('rumorCount').textContent = filtered.length + ' 条新闻';
}

// 修复 #4：改用更宽松的匹配，避免 \b 失效
function detectNewsTag(text) {
  var lower = ' ' + text.toLowerCase() + ' ';
  var tagNames = { 'transfer': '🔄 转会', 'match': '⚽ 比赛', 'injury': '🏥 伤病', 'title': '🏆 冠军', 'club': '🎯 俱乐部' };
  for (var tag in TAG_KEYWORDS) {
    var keywords = TAG_KEYWORDS[tag];
    for (var i = 0; i < keywords.length; i++) {
      var kw = keywords[i].toLowerCase();
      if (lower.indexOf(kw) !== -1) return tagNames[tag] || tag;
    }
  }
  return null;
}

function getFilteredRumors() {
  var search = document.getElementById('rumorSearchInput').value.toLowerCase();
  var filtered = allRumors;
  if (rumorTab !== 'all') {
    var teams = LEAGUE_TEAMS[rumorTab] || [];
    filtered = filtered.filter(function(item) {
      var text = (item.title + ' ' + item.summary).toLowerCase();
      return teams.some(function(team) { return text.indexOf(team.toLowerCase()) !== -1; });
    });
  }
  if (currentRumorTag !== 'all') {
    var keywords = TAG_KEYWORDS[currentRumorTag] || [];
    filtered = filtered.filter(function(item) {
      var text = ' ' + (item.title + ' ' + item.summary).toLowerCase() + ' ';
      return keywords.some(function(kw) {
        var k = kw.toLowerCase();
        return text.indexOf(k) !== -1;
      });
    });
  }
  if (search) {
    filtered = filtered.filter(function(item) {
      return (item.title + ' ' + item.summary + ' ' + item.source).toLowerCase().indexOf(search) !== -1;
    });
  }
  return filtered;
}

function switchRumorTab(tab) {
  rumorTab = tab;
  var btns = document.querySelectorAll('#rumorNav button');
  for (var i = 0; i < btns.length; i++) btns[i].className = '';
  var target = document.querySelector('#rumorNav button[onclick="switchRumorTab(\'' + tab + '\')"]');
  if (target) target.className = 'on';
  renderRumors();
}

function filterRumors() { renderRumors(); }

/* ================================================================
 * 页面切换
 * 修复 #19：兼容老浏览器
 * ================================================================ */
function forEachNodeList(list, fn) {
  for (var i = 0; i < list.length; i++) fn(list[i], i);
}

function switchPage(page) {
  if (autoRefreshEnabled) _stopAutoRefresh();
  forEachNodeList(document.querySelectorAll('.page'), function(el) { el.className = 'page'; });
  var pageEl = document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1));
  if (pageEl) pageEl.className = 'page active';
  forEachNodeList(document.querySelectorAll('.main-nav a'), function(el) { el.className = ''; });
  var navEl = document.getElementById('nav' + page.charAt(0).toUpperCase() + page.slice(1));
  if (navEl) navEl.className = 'on';
  document.getElementById('pageBadge').textContent = page === 'match' ? '比赛数据' : '足球新闻';
  if (page === 'match' && matchData.m.length === 0) refreshMatches();
  if (page === 'transfer' && allRumors.length === 0) fetchAllRumors();
}

window.onscroll = function() {
  var btn = document.getElementById('backTop');
  if (document.documentElement.scrollTop > 300) { btn.style.display = 'block'; }
  else { btn.style.display = 'none'; }
};

document.addEventListener('DOMContentLoaded', function() {
  updateDisplay('tzDisplayG', offsetG);
  updateDisplay('tzDisplayESPN', offsetESPN);
  refreshMatches();
});
</script>
