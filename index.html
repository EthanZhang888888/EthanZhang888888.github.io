<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西甲测试</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#0a120a;color:#eee;padding:20px}
.card{background:rgba(255,255,255,0.05);border-radius:16px;padding:16px;margin:10px 0;border:1px solid rgba(255,255,255,0.05)}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.team{flex:1;font-weight:600}
.score{font-size:24px;font-weight:800;color:#4caf50;padding:0 16px}
.status{font-size:12px;padding:4px 12px;border-radius:12px}
.live{background:rgba(255,82,82,0.2);color:#ff5252}
.finished{background:rgba(255,255,255,0.05);color:#888}
.upcoming{background:rgba(76,175,80,0.1);color:#4caf50}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 6px;color:#4caf50;font-size:11px;border-bottom:1px solid rgba(255,255,255,0.05)}
td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,0.02)}
.rank{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-weight:700;font-size:12px;margin-right:6px}
.gold{background:linear-gradient(135deg,#ffd700,#f9a825);color:#1a1a1a}
.silver{background:linear-gradient(135deg,#e0e0e0,#bdbdbd);color:#1a1a1a}
.bronze{background:linear-gradient(135deg,#e8a87c,#d4845a);color:#fff}
.normal{color:#666}
.loading{text-align:center;padding:60px 20px;color:#666}
.error{text-align:center;padding:60px 20px;color:#ff5252}
</style>
</head>
<body>

<h1>⚽ 西甲 2026-27</h1>
<div id="debug" style="background:rgba(255,255,255,0.03);padding:12px;border-radius:8px;margin:10px 0;font-size:12px;color:#666;max-height:200px;overflow:auto;display:none;white-space:pre-wrap;font-family:monospace;"></div>
<div id="standings"><div class="loading">加载积分榜...</div></div>
<div id="matches"><div class="loading">加载比赛...</div></div>

<script>
// ================================================================
// 中英文队名映射（西甲）
// ================================================================
var nameMap = {
  'Real Madrid':'皇家马德里','Barcelona':'巴塞罗那','Atletico Madrid':'马德里竞技',
  'Athletic Club':'毕尔巴鄂','Real Sociedad':'皇家社会','Sevilla':'塞维利亚',
  'Valencia':'瓦伦西亚','Villarreal':'比利亚雷亚尔','Real Betis':'贝蒂斯',
  'Girona':'赫罗纳','Osasuna':'奥萨苏纳','Celta Vigo':'塞尔塔',
  'Mallorca':'马略卡','Rayo Vallecano':'巴列卡诺','Las Palmas':'拉斯帕尔马斯',
  'Alaves':'阿拉维斯','Leganes':'莱加内斯','Espanyol':'西班牙人',
  'Getafe':'赫塔菲','Valladolid':'巴拉多利德','Deportivo':'拉科鲁尼亚',
  'Elche':'埃尔切','Levante':'莱万特','Malaga':'马拉加','Racing Santander':'桑坦德竞技'
};

// ================================================================
// 获取数据
// ================================================================
async function fetchData() {
  var debug = document.getElementById('debug');
  var standingsDiv = document.getElementById('standings');
  var matchesDiv = document.getElementById('matches');
  
  try {
    // 获取西甲比赛数据
    var url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/ESP.1/scoreboard';
    var response = await fetch(url);
    var data = await response.json();
    
    // 显示调试信息
    debug.style.display = 'block';
    debug.textContent = '✅ 请求成功！数据条数: ' + (data.events ? data.events.length : 0) + '\n' +
                        '📋 数据预览: ' + JSON.stringify(data, null, 2).substring(0, 800) + '...';
    
    var events = data.events || [];
    
    if (events.length === 0) {
      standingsDiv.innerHTML = '<div class="error">⚠️ 暂无比赛数据（西甲可能处于休赛期）</div>';
      matchesDiv.innerHTML = '<div class="error">⚠️ 暂无比赛数据</div>';
      return;
    }
    
    // 解析比赛
    var matches = parseMatches(events);
    var standings = calcStandings(matches);
    
    renderStandings(standings);
    renderMatches(matches);
    
  } catch(e) {
    debug.style.display = 'block';
    debug.textContent = '❌ 错误: ' + e.message + '\n💡 请检查网络连接';
    standingsDiv.innerHTML = '<div class="error">❌ 加载失败: ' + e.message + '</div>';
    matchesDiv.innerHTML = '<div class="error">❌ 加载失败: ' + e.message + '</div>';
  }
}

// ================================================================
// 解析比赛
// ================================================================
function parseMatches(events) {
  var result = [];
  for (var i = 0; i < events.length; i++) {
    var e = events[i];
    var c = e.competitions ? e.competitions[0] : null;
    if (!c || !c.competitors || c.competitors.length < 2) continue;
    
    var home = c.competitors[0];
    var away = c.competitors[1];
    
    var homeNameEn = home.team.displayName || home.team.shortDisplayName || '?';
    var awayNameEn = away.team.displayName || away.team.shortDisplayName || '?';
    
    var homeName = nameMap[homeNameEn] || homeNameEn;
    var awayName = nameMap[awayNameEn] || awayNameEn;
    
    // 判断状态
    var isFinished = false;
    var isLive = false;
    if (e.status && e.status.type) {
      if (e.status.type.state === 'post' || e.status.type.completed === true) isFinished = true;
      if (e.status.type.state === 'in') isLive = true;
    }
    if (e.status && e.status.displayClock === 'FT') isFinished = true;
    
    // 比分
    var homeScore = 0, awayScore = 0;
    if (home.score) {
      if (typeof home.score === 'object') {
        homeScore = parseInt(home.score.displayValue || home.score.value || '0') || 0;
      } else {
        homeScore = parseInt(home.score) || 0;
      }
    }
    if (away.score) {
      if (typeof away.score === 'object') {
        awayScore = parseInt(away.score.displayValue || away.score.value || '0') || 0;
      } else {
        awayScore = parseInt(away.score) || 0;
      }
    }
    
    var date = e.date ? new Date(e.date) : new Date();
    
    result.push({
      home: homeName,
      away: awayName,
      homeScore: homeScore,
      awayScore: awayScore,
      isFinished: isFinished,
      isLive: isLive,
      date: date,
      homeId: home.team.id || null,
      awayId: away.team.id || null
    });
  }
  return result;
}

// ================================================================
// 计算积分榜
// ================================================================
function calcStandings(matches) {
  var teams = {};
  
  // 初始化球队
  for (var i = 0; i < matches.length; i++) {
    var m = matches[i];
    if (!teams[m.home]) {
      teams[m.home] = { name: m.home, played: 0, won: 0, drawn: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, points: 0 };
    }
    if (!teams[m.away]) {
      teams[m.away] = { name: m.away, played: 0, won: 0, drawn: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, points: 0 };
    }
  }
  
  // 更新数据（只统计已结束的比赛）
  for (var i = 0; i < matches.length; i++) {
    var m = matches[i];
    if (!m.isFinished) continue;
    
    var home = teams[m.home];
    var away = teams[m.away];
    if (!home || !away) continue;
    
    home.played += 1;
    away.played += 1;
    home.goalsFor += m.homeScore;
    home.goalsAgainst += m.awayScore;
    away.goalsFor += m.awayScore;
    away.goalsAgainst += m.homeScore;
    
    if (m.homeScore > m.awayScore) {
      home.won += 1;
      home.points += 3;
      away.lost += 1;
    } else if (m.homeScore < m.awayScore) {
      away.won += 1;
      away.points += 3;
      home.lost += 1;
    } else {
      home.drawn += 1;
      away.drawn += 1;
      home.points += 1;
      away.points += 1;
    }
  }
  
  // 转数组并排序
  var result = [];
  for (var key in teams) {
    result.push(teams[key]);
  }
  result.sort(function(a, b) {
    if (b.points !== a.points) return b.points - a.points;
    var gdA = a.goalsFor - a.goalsAgainst;
    var gdB = b.goalsFor - b.goalsAgainst;
    return gdB - gdA;
  });
  
  return result;
}

// ================================================================
// 渲染积分榜
// ================================================================
function renderStandings(standings) {
  var div = document.getElementById('standings');
  if (!standings || standings.length === 0) {
    div.innerHTML = '<div class="loading">暂无积分榜数据</div>';
    return;
  }
  
  var html = '<h3 style="margin:16px 0 8px;">📈 积分榜 (' + standings.length + '队)</h3>';
  html += '<div style="overflow-x:auto;"><table>';
  html += '<tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进球</th><th>失球</th><th>净胜</th><th>积分</th></tr>';
  
  for (var i = 0; i < standings.length; i++) {
    var r = standings[i];
    var gd = r.goalsFor - r.goalsAgainst;
    var rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'normal';
    var gdStr = (gd > 0 ? '+' : '') + gd;
    
    html += '<tr>';
    html += '<td><span class="rank ' + rankClass + '">' + (i + 1) + '</span></td>';
    html += '<td><strong>' + r.name + '</strong></td>';
    html += '<td>' + r.played + '</td>';
    html += '<td>' + r.won + '</td>';
    html += '<td>' + r.drawn + '</td>';
    html += '<td>' + r.lost + '</td>';
    html += '<td>' + r.goalsFor + '</td>';
    html += '<td>' + r.goalsAgainst + '</td>';
    html += '<td>' + gdStr + '</td>';
    html += '<td><strong>' + r.points + '</strong></td>';
    html += '</tr>';
  }
  
  html += '</table></div>';
  div.innerHTML = html;
}

// ================================================================
// 渲染比赛
// ================================================================
function renderMatches(matches) {
  var div = document.getElementById('matches');
  if (!matches || matches.length === 0) {
    div.innerHTML = '<div class="loading">暂无比赛</div>';
    return;
  }
  
  // 分组
  var live = matches.filter(function(m) { return m.isLive; });
  var finished = matches.filter(function(m) { return m.isFinished && !m.isLive; });
  var upcoming = matches.filter(function(m) { return !m.isFinished && !m.isLive; });
  
  var html = '';
  
  // 直播中
  if (live.length > 0) {
    html += '<h3 style="margin:16px 0 8px;color:#ff5252;">🔴 直播中</h3>';
    for (var i = 0; i < live.length; i++) {
      html += renderMatchCard(live[i], 'live');
    }
  }
  
  // 已结束
  if (finished.length > 0) {
    html += '<h3 style="margin:16px 0 8px;color:#888;">✅ 已结束</h3>';
    // 只显示最近12场
    var recent = finished.slice(-12);
    for (var i = 0; i < recent.length; i++) {
      html += renderMatchCard(recent[i], 'finished');
    }
  }
  
  // 即将开始
  if (upcoming.length > 0) {
    html += '<h3 style="margin:16px 0 8px;color:#4caf50;">⏰ 即将开始</h3>';
    var upcomingRecent = upcoming.slice(0, 12);
    for (var i = 0; i < upcomingRecent.length; i++) {
      html += renderMatchCard(upcomingRecent[i], 'upcoming');
    }
  }
  
  if (html === '') {
    html = '<div class="loading">暂无比赛</div>';
  }
  div.innerHTML = html;
}

function renderMatchCard(m, status) {
  var dateStr = m.date ? m.date.toLocaleDateString('zh-CN', {month:'2-digit', day:'2-digit'}) : '';
  var timeStr = m.date ? m.date.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}) : '';
  
  var statusLabel = '';
  var statusClass = '';
  if (status === 'live') {
    statusLabel = '● 直播中';
    statusClass = 'live';
  } else if (status === 'finished') {
    statusLabel = '✓ 已结束';
    statusClass = 'finished';
  } else {
    statusLabel = '⏰ 即将开始';
    statusClass = 'upcoming';
  }
  
  var scoreDisplay = (status === 'live' || status === 'finished') ? 
                      m.homeScore + '-' + m.awayScore : 'VS';
  
  var winnerClass = '';
  if (status === 'finished') {
    if (m.homeScore > m.awayScore) winnerClass = 'color:#4caf50;';
    else if (m.homeScore < m.awayScore) winnerClass = 'color:#4caf50;';
  }
  
  return '<div class="card">' +
    '<div style="display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:8px;">' +
      '<span>' + dateStr + ' ' + timeStr + '</span>' +
      '<span class="status ' + statusClass + '">' + statusLabel + '</span>' +
    '</div>' +
    '<div class="row">' +
      '<div class="team">' + m.home + '</div>' +
      '<div class="score">' + scoreDisplay + '</div>' +
      '<div class="team" style="text-align:right;">' + m.away + '</div>' +
    '</div>' +
  '</div>';
}

// ================================================================
// 启动
// ================================================================
fetchData();
</script>

</body>
</html>
